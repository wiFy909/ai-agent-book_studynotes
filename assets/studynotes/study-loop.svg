<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">个人学习与提交的五角循环</title>
  <desc id="desc">精读原文、实践代码、经验对照、价值标记、提交更新五个步骤沿五边形顺时针循环</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="0.56" stop-color="#111b3a"/>
      <stop offset="1" stop-color="#25134a"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pentagon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#818cf8"/>
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="598" rx="29" fill="none" stroke="#cbd5e1" stroke-opacity="0.16"/>
  <circle cx="600" cy="330" r="250" fill="url(#centerGlow)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="600" y="46" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="800">把阅读变成可验证、可复用的学习记录</text>
    <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="13.5" font-weight="650" letter-spacing="1.5">五个步骤沿同一方向循环，每次提交回到下一轮精读</text>

    <!-- Faint pentagon establishes the whole loop at a glance. -->
    <path d="M600 150L930 280L805 485L395 485L270 280Z" fill="#0f172a" fill-opacity="0.34" stroke="url(#pentagon)" stroke-opacity="0.24" stroke-width="12" stroke-linejoin="round"/>

    <!-- Clockwise arrows stop before each node so direction remains visible. -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <line x1="670" y1="178" x2="851" y2="249" stroke="#22d3ee" marker-end="url(#arrowCyan)"/>
      <line x1="892" y1="342" x2="846" y2="417" stroke="#60a5fa" marker-end="url(#arrowBlue)"/>
      <line x1="733" y1="485" x2="473" y2="485" stroke="#818cf8" marker-end="url(#arrowIndigo)"/>
      <line x1="357" y1="423" x2="311" y2="348" stroke="#a78bfa" marker-end="url(#arrowViolet)"/>
      <line x1="344" y1="251" x2="525" y2="180" stroke="#c084fc" marker-end="url(#arrowPurple)"/>
    </g>
    <g>
      <path d="M-9-7L10 0L-9 7Z" fill="#22d3ee" transform="translate(760 213) rotate(21.5)"/>
      <path d="M-9-7L10 0L-9 7Z" fill="#60a5fa" transform="translate(869 382) rotate(121)"/>
      <path d="M-9-7L10 0L-9 7Z" fill="#818cf8" transform="translate(600 485) rotate(180)"/>
      <path d="M-9-7L10 0L-9 7Z" fill="#a78bfa" transform="translate(331 382) rotate(239)"/>
      <path d="M-9-7L10 0L-9 7Z" fill="#c084fc" transform="translate(440 213) rotate(-21.5)"/>
    </g>

    <!-- Center meaning of the cycle. -->
    <circle cx="600" cy="330" r="91" fill="#111827" stroke="#64748b" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="600" cy="330" r="78" fill="none" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="1.5"/>
    <text x="600" y="318" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">学习闭环</text>
    <text x="600" y="348" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="650">可验证 · 可复用</text>
    <text x="600" y="373" text-anchor="middle" fill="#94a3b8" font-size="12.5">记录进入下一轮行动</text>

    <!-- 1 -->
    <g transform="translate(600 150)">
      <circle r="73" fill="#0b2031" stroke="#22d3ee" stroke-width="2.2"/>
      <circle cy="-27" r="18" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
      <text y="-21" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="800">1</text>
      <text y="16" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="780">精读原文</text>
      <text y="43" text-anchor="middle" fill="#94a3b8" font-size="12.5">定位概念与边界</text>
    </g>

    <!-- 2 -->
    <g transform="translate(930 280)">
      <circle r="73" fill="#0b1d33" stroke="#38bdf8" stroke-width="2.2"/>
      <circle cy="-27" r="18" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
      <text y="-21" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="800">2</text>
      <text y="16" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="780">实践代码</text>
      <text y="43" text-anchor="middle" fill="#94a3b8" font-size="12.5">记录观察与失败</text>
    </g>

    <!-- 3 -->
    <g transform="translate(805 485)">
      <circle r="73" fill="#111b38" stroke="#60a5fa" stroke-width="2.2"/>
      <circle cy="-27" r="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text y="-21" text-anchor="middle" fill="#93c5fd" font-size="18" font-weight="800">3</text>
      <text y="16" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="780">经验对照</text>
      <text y="43" text-anchor="middle" fill="#94a3b8" font-size="12.5">解释成功与教训</text>
    </g>

    <!-- 4 -->
    <g transform="translate(395 485)">
      <circle r="73" fill="#171738" stroke="#818cf8" stroke-width="2.2"/>
      <circle cy="-27" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text y="-21" text-anchor="middle" fill="#a5b4fc" font-size="18" font-weight="800">4</text>
      <text y="16" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="780">价值标记</text>
      <text y="43" text-anchor="middle" fill="#94a3b8" font-size="12.5">区分事实与推演</text>
    </g>

    <!-- 5 -->
    <g transform="translate(270 280)">
      <circle r="73" fill="#21143a" stroke="#c084fc" stroke-width="2.2"/>
      <circle cy="-27" r="18" fill="#3b0764" stroke="#c084fc" stroke-width="2" filter="url(#softGlow)"/>
      <text y="-21" text-anchor="middle" fill="#e9d5ff" font-size="18" font-weight="800">5</text>
      <text y="16" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="780">提交更新</text>
      <text y="43" text-anchor="middle" fill="#c4b5fd" font-size="12.5">进度 · 心得 · 路径</text>
    </g>
  </g>
</svg>
