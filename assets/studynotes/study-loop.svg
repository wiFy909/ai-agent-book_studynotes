<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">个人学习与提交循环</title>
  <desc id="desc">精读原文、实践代码、经验对照、价值标记、提交更新五个步骤形成持续循环</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L8 3Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#94a3b8" stroke-opacity="0.18"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="600" y="52" text-anchor="middle" fill="#f8fafc" font-size="25" font-weight="800">把阅读变成可验证、可复用的学习记录</text>
    <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14" letter-spacing="1.2">READ → RUN → COMPARE → MARK → COMMIT</text>

    <g stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
      <line x1="232" y1="177" x2="270" y2="177"/>
      <line x1="456" y1="177" x2="494" y2="177"/>
      <line x1="680" y1="177" x2="718" y2="177"/>
      <line x1="904" y1="177" x2="942" y2="177"/>
    </g>

    <g transform="translate(48 112)">
      <rect width="184" height="130" rx="20" fill="#111827" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle cx="92" cy="35" r="19" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
      <text x="92" y="42" text-anchor="middle" fill="#67e8f9" font-size="20" font-weight="800">1</text>
      <text x="92" y="78" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="750">精读原文</text>
      <text x="92" y="104" text-anchor="middle" fill="#94a3b8" font-size="13">定位概念与边界</text>
    </g>

    <g transform="translate(272 112)">
      <rect width="184" height="130" rx="20" fill="#111827" stroke="#38bdf8" stroke-opacity="0.7"/>
      <circle cx="92" cy="35" r="19" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
      <text x="92" y="42" text-anchor="middle" fill="#7dd3fc" font-size="20" font-weight="800">2</text>
      <text x="92" y="78" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="750">实践代码</text>
      <text x="92" y="104" text-anchor="middle" fill="#94a3b8" font-size="13">记录观察与失败</text>
    </g>

    <g transform="translate(496 112)">
      <rect width="184" height="130" rx="20" fill="#111827" stroke="#60a5fa" stroke-opacity="0.7"/>
      <circle cx="92" cy="35" r="19" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
      <text x="92" y="42" text-anchor="middle" fill="#93c5fd" font-size="20" font-weight="800">3</text>
      <text x="92" y="78" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="750">经验对照</text>
      <text x="92" y="104" text-anchor="middle" fill="#94a3b8" font-size="13">解释成功与教训</text>
    </g>

    <g transform="translate(720 112)">
      <rect width="184" height="130" rx="20" fill="#111827" stroke="#818cf8" stroke-opacity="0.7"/>
      <circle cx="92" cy="35" r="19" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
      <text x="92" y="42" text-anchor="middle" fill="#a5b4fc" font-size="20" font-weight="800">4</text>
      <text x="92" y="78" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="750">价值标记</text>
      <text x="92" y="104" text-anchor="middle" fill="#94a3b8" font-size="13">区分事实与推演</text>
    </g>

    <g transform="translate(944 112)">
      <rect width="184" height="130" rx="20" fill="#111827" stroke="#c084fc" stroke-opacity="0.8"/>
      <circle cx="92" cy="35" r="19" fill="#3b0764" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
      <text x="92" y="42" text-anchor="middle" fill="#e9d5ff" font-size="20" font-weight="800">5</text>
      <text x="92" y="78" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="750">提交更新</text>
      <text x="92" y="104" text-anchor="middle" fill="#94a3b8" font-size="13">进度 · 心得 · 路径</text>
    </g>

    <path d="M1036 255C1036 292 164 292 164 255" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 9"/>
    <path d="M164 255L154 270L176 266Z" fill="#22d3ee"/>
  </g>
</svg>
