<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 精读、实验与 Vibe Coding 复盘</title>
  <desc id="desc">从 2022 年单语言模型使用走向 2026 年 Harness 级 Agent 工程实践的学习路径</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111b3a"/>
      <stop offset="1" stop-color="#25134a"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.16" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.84" cy="0.72" r="0.56">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="30" fill="url(#cyanGlow)"/>
  <rect width="1200" height="520" rx="30" fill="url(#violetGlow)"/>
  <rect x="1" y="1" width="1198" height="518" rx="29" fill="none" stroke="#cbd5e1" stroke-opacity="0.16"/>
  <rect width="1200" height="520" rx="30" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 48)">
      <rect width="198" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.52"/>
      <circle cx="19" cy="17" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="34" y="22" fill="#bae6fd" font-size="13" font-weight="700" letter-spacing="1.7">PERSONAL STUDY FORK</text>
    </g>

    <text x="64" y="147" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.6">AI AGENT · STUDY NOTES</text>
    <text x="66" y="194" fill="#cbd5e1" font-size="25" font-weight="500">精读 · 实验 · 评估 · Vibe Coding 复盘</text>

    <g transform="translate(64 236)">
      <rect width="1072" height="112" rx="24" fill="url(#chip)" stroke="#94a3b8" stroke-opacity="0.18"/>
      <text x="536" y="44" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="3">CORE MODEL</text>
      <text x="536" y="83" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="750">
        MODEL
        <tspan fill="#22d3ee"> + CONTEXT</tspan>
        <tspan fill="#60a5fa"> + TOOLS</tspan>
        <tspan fill="#c084fc"> + HARNESS</tspan>
      </text>
    </g>

    <g transform="translate(64 397)">
      <line x1="52" y1="32" x2="1014" y2="32" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(0)">
        <circle cx="52" cy="32" r="12" fill="#07111f" stroke="#22d3ee" stroke-width="4"/>
        <text x="52" y="5" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="800">2022</text>
        <text x="52" y="67" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="650">SINGLE LLM</text>
      </g>
      <g transform="translate(321)">
        <circle cx="52" cy="32" r="12" fill="#07111f" stroke="#38bdf8" stroke-width="4"/>
        <text x="52" y="5" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="800">PROMPT</text>
        <text x="52" y="67" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="650">API · TOOL CALL</text>
      </g>
      <g transform="translate(642)">
        <circle cx="52" cy="32" r="12" fill="#07111f" stroke="#818cf8" stroke-width="4"/>
        <text x="52" y="5" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="800">AGENT</text>
        <text x="52" y="67" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="650">FILES · SHELL · WEB</text>
      </g>
      <g transform="translate(962)">
        <circle cx="52" cy="32" r="12" fill="#07111f" stroke="#c084fc" stroke-width="4"/>
        <text x="52" y="5" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="800">2026</text>
        <text x="52" y="67" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="650">HARNESS LEVEL</text>
      </g>
    </g>
  </g>
</svg>
