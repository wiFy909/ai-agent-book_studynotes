<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 精读、实验与 Vibe Coding 复盘</title>
  <desc id="desc">上半部分展示当前 Agent 核心与 Harness 工程层的关系，下半部分用一条连续时间线展示 2022 到 2026 年的个人 AI 实践演进</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111b3a"/>
      <stop offset="1" stop-color="#25134a"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.16" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0.84" cy="0.72" r="0.56">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="timelineArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 10L11 5Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="30" fill="url(#cyanGlow)"/>
  <rect width="1200" height="560" rx="30" fill="url(#violetGlow)"/>
  <rect x="1" y="1" width="1198" height="558" rx="29" fill="none" stroke="#cbd5e1" stroke-opacity="0.16"/>
  <rect width="1200" height="560" rx="30" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g transform="translate(64 38)">
      <rect width="198" height="34" rx="17" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.52"/>
      <circle cx="19" cy="17" r="5" fill="#22d3ee" filter="url(#softGlow)"/>
      <text x="34" y="22" fill="#bae6fd" font-size="13" font-weight="700" letter-spacing="1.7">PERSONAL STUDY FORK</text>
    </g>

    <text x="64" y="132" fill="#f8fafc" font-size="56" font-weight="800" letter-spacing="-1.6">AI AGENT · STUDY NOTES</text>
    <text x="66" y="176" fill="#cbd5e1" font-size="24" font-weight="500">精读 · 实验 · 评估 · Vibe Coding 复盘</text>

    <!-- Current architecture: the Harness envelope is intentionally separate from the timeline below. -->
    <g>
      <rect x="64" y="208" width="1072" height="154" rx="25" fill="#161b31" fill-opacity="0.88" stroke="#a855f7" stroke-opacity="0.48" stroke-width="1.5"/>
      <text x="600" y="236" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="750" letter-spacing="2.2">当前 AGENT 工程结构 · CURRENT ARCHITECTURE</text>
      <text x="600" y="343" text-anchor="middle" fill="#a78bfa" font-size="12.5" font-weight="650" letter-spacing="0.7">HARNESS 工程保障层 · 编排 · 权限 · 验证 · 纠错</text>

      <rect x="116" y="252" width="968" height="70" rx="19" fill="url(#core)" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="258" y="281" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="750" letter-spacing="2">AGENT CORE</text>
      <line x1="365" y1="269" x2="365" y2="305" stroke="#475569" stroke-width="1"/>
      <text x="724" y="296" text-anchor="middle" fill="#f8fafc" font-size="27" font-weight="780">
        MODEL
        <tspan fill="#22d3ee"> + CONTEXT</tspan>
        <tspan fill="#60a5fa"> + TOOLS</tspan>
      </text>
    </g>

    <!-- One continuous personal-practice timeline. -->
    <g>
      <text x="64" y="405" fill="#94a3b8" font-size="13" font-weight="750" letter-spacing="2">个人 AI 实践演进 · 2022 → 2026</text>
      <line x1="116" y1="455" x2="1090" y2="455" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
      <line x1="116" y1="455" x2="1090" y2="455" stroke="url(#timeline)" stroke-width="4" stroke-linecap="round" marker-end="url(#timelineArrow)"/>

      <g transform="translate(150 455)">
        <circle r="13" fill="#07111f" stroke="#22d3ee" stroke-width="4"/>
        <text y="-28" text-anchor="middle" fill="#67e8f9" font-size="15" font-weight="800">2022</text>
        <text y="43" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="750">单一 LLM 问答</text>
        <text y="66" text-anchor="middle" fill="#94a3b8" font-size="12.5">把模型当作回答者</text>
      </g>

      <g transform="translate(430 455)">
        <circle r="13" fill="#07111f" stroke="#38bdf8" stroke-width="4"/>
        <text y="-28" text-anchor="middle" fill="#7dd3fc" font-size="15" font-weight="800">2023</text>
        <text y="43" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="750">Prompt · API</text>
        <text y="66" text-anchor="middle" fill="#94a3b8" font-size="12.5">开始编排模型能力</text>
      </g>

      <g transform="translate(720 455)">
        <circle r="13" fill="#07111f" stroke="#818cf8" stroke-width="4"/>
        <text y="-28" text-anchor="middle" fill="#a5b4fc" font-size="15" font-weight="800">2024—2025</text>
        <text y="43" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="750">工具型 Agent</text>
        <text y="66" text-anchor="middle" fill="#94a3b8" font-size="12.5">Files · Shell · Web</text>
      </g>

      <g transform="translate(1014 455)">
        <circle r="13" fill="#07111f" stroke="#c084fc" stroke-width="4" filter="url(#softGlow)"/>
        <text y="-28" text-anchor="middle" fill="#d8b4fe" font-size="15" font-weight="800">2026</text>
        <text y="43" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="750">Harness 级工程</text>
        <text y="66" text-anchor="middle" fill="#c4b5fd" font-size="12.5">可控 · 可验 · 可恢复</text>
      </g>
    </g>
  </g>
</svg>
